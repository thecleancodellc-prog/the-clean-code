<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Clean Code Social Command Center</title>
  <style>
    :root { color-scheme: dark; --bg:#08120d; --panel:#101f17; --panel2:#14281d; --text:#f2fff7; --muted:#a9c7b6; --green:#65d58b; --gold:#e1bb63; --red:#ff7b7b; --line:rgba(255,255,255,.12); }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,Segoe UI,Arial,sans-serif; background:radial-gradient(circle at top left,rgba(101,213,139,.2),transparent 32rem),var(--bg); color:var(--text); }
    header { padding:28px clamp(18px,4vw,48px); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:18px; align-items:center; }
    h1 { margin:0; font-size:clamp(28px,4vw,48px); letter-spacing:0; }
    .sub { margin-top:8px; color:var(--muted); max-width:780px; }
    .pill { display:inline-flex; border:1px solid var(--line); background:rgba(255,255,255,.06); padding:8px 12px; border-radius:999px; color:var(--muted); white-space:nowrap; }
    main { padding:24px clamp(18px,4vw,48px) 48px; }
    .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:20px; }
    .metric,.panel,.draft,.hero { background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03)); border:1px solid var(--line); border-radius:8px; }
    .metric { padding:16px; }
    .label { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.08em; }
    .value { font-size:30px; font-weight:800; margin-top:6px; }
    .readiness { margin-bottom:20px; padding:18px; background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03)); border:1px solid var(--line); border-radius:8px; }
    .readiness-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px; }
    .readiness-head h2 { margin:0 0 5px; font-size:20px; }
    .readiness-head p { margin:0; color:var(--muted); }
    .connector-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
    .connector { padding:12px; border:1px solid var(--line); border-radius:7px; background:rgba(255,255,255,.035); min-width:0; }
    .connector strong { display:block; text-transform:capitalize; margin-bottom:7px; }
    .connector-line { color:var(--muted); font-size:12px; line-height:1.55; overflow-wrap:anywhere; }
    .blocker-list { display:grid; gap:6px; margin-top:14px; }
    .blocker { padding:8px 10px; border-left:3px solid var(--gold); background:rgba(255,255,255,.03); color:#dff8e8; font-size:13px; }
    .blocker.critical { border-left-color:var(--red); }
    .next-action { margin-top:14px; padding:11px 12px; border:1px solid rgba(101,213,139,.3); background:rgba(101,213,139,.08); color:#dcffe8; border-radius:7px; }
    .layout { display:grid; grid-template-columns:minmax(320px,440px) 1fr; gap:16px; align-items:start; }
    .panel { overflow:hidden; }
    .panel h2 { margin:0; padding:16px; border-bottom:1px solid var(--line); font-size:18px; }
    .queue { max-height:72vh; overflow:auto; }
    .queue button { width:100%; border:0; border-bottom:1px solid var(--line); background:transparent; color:var(--text); text-align:left; padding:14px 16px; cursor:pointer; }
    .queue button:hover,.queue button.active { background:rgba(101,213,139,.12); }
    .queue-title { font-weight:750; line-height:1.25; }
    .queue-meta { margin-top:6px; display:flex; gap:8px; flex-wrap:wrap; color:var(--muted); font-size:12px; }
    .tag { border:1px solid var(--line); border-radius:999px; padding:3px 8px; }
    .green { color:var(--green); } .gold { color:var(--gold); } .red { color:var(--red); }
    .detail { display:grid; gap:14px; }
    .hero { padding:18px; background:var(--panel); }
    .hero h2 { margin:0 0 8px; font-size:26px; }
    .drafts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .visual-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .visual-card { padding:14px; border:1px solid var(--line); border-radius:8px; background:rgba(255,255,255,.04); }
    .visual-card h3 { margin:0 0 8px; color:var(--gold); }
    .asset-img { width:100%; max-height:360px; object-fit:cover; border-radius:8px; border:1px solid var(--line); margin:10px 0; background:#07120c; }
    .asset-gallery { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin:10px 0; }
    .asset-gallery figure { margin:0; min-width:0; }
    .asset-gallery img { display:block; width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:6px; border:1px solid var(--line); background:#07120c; }
    .asset-gallery figcaption { margin-top:4px; color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .asset-path { margin-top:10px; color:var(--muted); font-size:12px; word-break:break-word; }
    .slides { margin:10px 0 0; padding-left:18px; color:#dff8e8; line-height:1.45; }
    .draft { padding:14px; min-height:220px; }
    .draft h3 { margin:0 0 10px; color:var(--green); }
    pre { margin:0; white-space:pre-wrap; word-break:break-word; color:#dff8e8; font-family:inherit; line-height:1.45; }
    .empty { padding:30px; color:var(--muted); }
    @media (max-width:980px) { .metrics,.layout,.drafts,.visual-grid,.connector-grid { grid-template-columns:1fr; } header { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <header><div><h1>Social Command Center</h1><div class="sub">Turn Clean Code articles into Pinterest pins, Instagram captions, TikTok scripts, and Facebook posts. Draft first, post after review.</div></div><div class="pill" id="statusPill">Loading</div></header>
  <main><section class="metrics" id="metrics"></section><section class="readiness" id="readiness"><div class="empty">Checking launch readiness...</div></section><section class="layout"><div class="panel"><h2>Posting Queue</h2><div class="queue" id="queue"></div></div><div class="detail" id="detail"></div></section></main>
  <script>
    let state = null, readinessState = null, selected = null;
    const esc = v => String(v ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[ch]));
    const metric = (label, value) => `<div class="metric"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div></div>`;
    function renderMetrics(){ const c=state?.counts||{}; metrics.innerHTML=[metric("Total Drafts",c.total??0),metric("Ready",c.ready??0),metric("Revenue Ready",c.revenueReady??0),metric("Visual Ready",c.visualAssetsReady??0),metric("Visual Briefs",c.visualBriefs??0),metric("Needs Assets",c.visualAssetsNeeded??0),metric("Blocked",c.blocked??0)].join(""); statusPill.textContent=state?.socialStatus||"not generated"; }
    function renderReadiness(){
      if(!readinessState){ readiness.innerHTML='<div class="empty">Launch readiness unavailable.</div>'; return; }
      const connectors=readinessState.connectors||{};
      const connectorCards=Object.entries(connectors).map(([name,item])=>`<div class="connector"><strong>${esc(name)}</strong><div class="connector-line">Account: <span class="${item.account==='account-created'?'green':'gold'}">${esc(item.account)}</span></div><div class="connector-line">Publishing: <span class="${item.apiConfigured?'green':'gold'}">${item.apiConfigured?'API connected':esc(item.mode)}</span></div></div>`).join('');
      const blockers=(readinessState.blockers||[]).slice(0,8).map(item=>`<div class="blocker ${esc(item.level)}">${esc(item.message)}</div>`).join('');
      readiness.innerHTML=`<div class="readiness-head"><div><h2>Launch Readiness</h2><p>What can publish now, and what still needs setup.</p></div><span class="pill ${readinessState.manualReady?'green':'gold'}">${esc(readinessState.phase)}</span></div><div class="connector-grid">${connectorCards}</div>${blockers?`<div class="blocker-list">${blockers}</div>`:''}<div class="next-action"><strong>Next:</strong> ${esc(readinessState.nextAction)}</div>`;
    }
    function renderQueue(){ const q=state?.queue||[]; if(!q.length){ queue.innerHTML='<div class="empty">Run npm run social to generate drafts.</div>'; return; } selected=selected||q[0]; queue.innerHTML=q.slice(0,100).map(item=>`<button class="${selected.slug===item.slug?'active':''}" data-slug="${esc(item.slug)}"><div class="queue-title">${esc(item.title)}</div><div class="queue-meta"><span class="tag ${item.blockers?.length?'red':'green'}">${item.blockers?.length?item.blockers.length+' blocker(s)':'ready'}</span><span class="tag ${item.priority==='revenue'?'gold':''}">${esc(item.priority)}</span><span class="tag">score ${esc(item.score)}</span></div></button>`).join(""); document.querySelectorAll("[data-slug]").forEach(btn=>btn.onclick=()=>{ selected=q.find(i=>i.slug===btn.dataset.slug); renderQueue(); renderDetail(); }); }
    function card(name,text){ return `<article class="draft"><h3>${esc(name)}</h3><pre>${esc(text||"No draft yet.")}</pre></article>`; }
    function assetUrl(path){ return path && /\.(png|jpe?g|webp|gif)$/i.test(path) ? "/" + path.replace(/^\/+/,"") : ""; }
    function visualCard(name, item){ const images=(item?.generatedImages||[]).map(entry=>({src:assetUrl(entry.outputPath),label:entry.overlayText||entry.role||`Slide ${entry.slide}`})).filter(entry=>entry.src); const img=!images.length?assetUrl(item?.outputPath):""; const gallery=images.length?`<div class="asset-gallery">${images.map((entry,index)=>`<figure><img src="${esc(entry.src)}" alt="${esc(name)} slide ${index+1}"><figcaption>${esc(index+1+". "+entry.label)}</figcaption></figure>`).join("")}</div>`:""; const bad=["needs_asset","needs_photo"].includes(item?.status); return `<article class="visual-card"><h3>${esc(name)}</h3><div class="queue-meta"><span class="tag gold">${esc(item?.size||item?.format||"brief")}</span><span class="tag ${bad?"red":"green"}">${esc(item?.status||"brief_ready")}</span>${images.length?`<span class="tag">${images.length} images</span>`:""}</div>${gallery}${img?`<img class="asset-img" src="${esc(img)}" alt="${esc(name)} asset">`:""}<pre>${esc(item?.prompt||item?.coverPrompt||item?.hookText||"No visual brief yet.")}</pre>${item?.slides?.length?`<ol class="slides">${item.slides.slice(0,6).map(s=>`<li>${esc(s.text||s.role)}</li>`).join("")}</ol>`:""}${item?.storyboard?.length?`<ol class="slides">${item.storyboard.slice(0,5).map(s=>`<li>${esc(s.seconds)}: ${esc(s.overlay||s.shot)}</li>`).join("")}</ol>`:""}${item?.outputPath?`<div class="asset-path">${esc(item.outputPath)}</div>`:""}</article>`; }
    function renderDetail(){ if(!selected){ detail.innerHTML='<div class="empty">Select a post.</div>'; return; } const p=selected.platforms||{}; const v=selected.visuals||{}; detail.innerHTML=`<section class="hero"><h2>${esc(selected.title)}</h2><div class="queue-meta"><span class="tag">${esc(selected.slug)}</span><span class="tag ${selected.blockers?.length?'red':'green'}">${selected.blockers?.length?selected.blockers.join(", "):"ready to review"}</span><span class="tag gold">visuals: ${esc(v.productionStatus||"not generated")}</span></div></section><section class="visual-grid">${visualCard("Pinterest Pin",v.pinterestPin)}${visualCard("Instagram Carousel",v.instagramCarousel)}${visualCard("Reel / TikTok",v.shortVideo)}</section><section class="drafts">${card("Pinterest",(p.pinterest?.title||"")+"\n\n"+(p.pinterest?.description||"")+"\n\n"+(p.pinterest?.link||""))}${card("Instagram",p.instagram?.caption)}${card("TikTok",p.tiktok?.script)}${card("Facebook",p.facebook?.text)}</section>`; }
    async function fetchSocialJson(url){
      const res=await fetch(url,{headers:{"Accept":"application/json"}});
      const body=await res.text();
      const type=res.headers.get("content-type")||"";
      if(!res.ok) throw new Error(`${url} returned HTTP ${res.status}`);
      if(!type.includes("application/json")){
        const preview=body.slice(0,44).replace(/\s+/g," ");
        throw new Error(`${url} returned ${preview}. Open http://localhost:4000/social-command-center.html or restart npm run dashboard.`);
      }
      return JSON.parse(body);
    }
    async function load(){
      const urls=location.port==="4000"
        ? ["/api/social-command","http://localhost:4000/api/social-command"]
        : ["http://localhost:4000/api/social-command","/api/social-command"];
      let lastError=null;
      for(const url of urls){
        try{ state=await fetchSocialJson(url); break; }
        catch(err){ lastError=err; }
      }
      if(!state) throw lastError||new Error("Social queue unavailable.");
      try { readinessState=await fetchSocialJson("http://localhost:4000/api/social-readiness"); }
      catch { try { readinessState=await fetchSocialJson("/api/social-readiness"); } catch { readinessState=null; } }
      selected=state.queue?.[0]||null;
      renderMetrics();
      renderReadiness();
      renderQueue();
      renderDetail();
    }
    load().catch(err=>{ detail.innerHTML=`<div class="empty">Could not load social queue: ${esc(err.message)}<br><br>Run <code>cd E:\\WebProjects\\TheCleanCode</code>, then <code>npm run dashboard</code>.</div>`; });
  </script>
</body>
</html>
