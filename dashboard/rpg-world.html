<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>TCC — RPG World</title>
  <style>
    :root { --font: "Courier New", monospace; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #000; font-family: var(--font); }

    /* ── STAR CANVAS ── */
    #stars { position: fixed; inset: 0; z-index: 0; }

    /* ── LAYOUT ── */
    #app {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100vh;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0;
      background: rgba(0,0,0,.88);
      border-bottom: 2px solid #1a3a22;
      padding: 7px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .hdr-logo { color: #00ff6a; font-size: 13px; letter-spacing: 4px; text-shadow: 0 0 10px #00ff6a; }
    .hdr-meta { display: flex; gap: 16px; align-items: center; }
    .hdr-tag  { font-size: 9px; color: #3d7a52; letter-spacing: 2px; border: 1px solid #1a3a22; padding: 2px 8px; }
    .hdr-tag.lit { color: #00ff6a; border-color: #00aa44; box-shadow: 0 0 6px #00ff6a44; }
    .hdr-clock { font-size: 16px; color: #00ff6a; letter-spacing: 3px; text-shadow: 0 0 8px #00ff6a66; }

    /* ── WORLD GRID ── */
    .world {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 2px;
      background: #050505;
      overflow: hidden;
      padding: 2px;
    }

    /* ── ROOM ── */
    .room {
      position: relative;
      display: flex; flex-direction: column;
      overflow: hidden;
      border: 2px solid var(--bcol);
      background: var(--bgcol);
      transition: border-color .3s, box-shadow .3s;
    }
    .room::before {
      content: "";
      position: absolute; inset: 0;
      background: var(--bggrad);
      z-index: 0; pointer-events: none;
    }
    .room.running {
      border-color: var(--gcol) !important;
      box-shadow: 0 0 22px var(--gcol), inset 0 0 40px rgba(0,0,0,.4);
    }
    .room.error { border-color: #4a1a1a !important; box-shadow: 0 0 12px #ff000033; }

    /* ── ROOM THEMES ── */
    .r-scout     { --bgcol:#020d02; --bcol:#0f2e12; --gcol:#00ff44; --grd1:#051a06; --grd2:#0a1e0a; --grd3:#0d280d; --pcol:#00aa33; --prun:#00ff44; --bggrad:radial-gradient(ellipse at 50% 0%,#051a06,#020d02 70%); }
    .r-amazon    { --bgcol:#0d0800; --bcol:#2e1e0f; --gcol:#ffaa00; --grd1:#1a1000; --grd2:#1a1000; --grd3:#241600; --pcol:#aa6600; --prun:#ffaa00; --bggrad:radial-gradient(ellipse at 50% 0%,#1a1000,#0d0800 70%); }
    .r-scribe    { --bgcol:#04020d; --bcol:#1a0f2e; --gcol:#a855f7; --grd1:#0d0620; --grd2:#0d0a1e; --grd3:#110e28; --pcol:#7c3aed; --prun:#c084fc; --bggrad:radial-gradient(ellipse at 50% 0%,#0d0620,#04020d 70%); }
    .r-image     { --bgcol:#0d0400; --bcol:#2e1200; --gcol:#ff6600; --grd1:#1a0800; --grd2:#1e0a00; --grd3:#280e00; --pcol:#cc4400; --prun:#ff8800; --bggrad:radial-gradient(ellipse at 50% 0%,#1a0800,#0d0400 70%); }
    .r-publisher { --bgcol:#00050d; --bcol:#0f1e2e; --gcol:#00aaff; --grd1:#001a2e; --grd2:#000d1e; --grd3:#001228; --pcol:#0088cc; --prun:#44ccff; --bggrad:radial-gradient(ellipse at 50% 0%,#001a2e,#00050d 70%); }
    .r-spark     { --bgcol:#0d000d; --bcol:#2e0f2e; --gcol:#ff00ff; --grd1:#1a001a; --grd2:#1e001e; --grd3:#280028; --pcol:#cc00cc; --prun:#ff44ff; --bggrad:radial-gradient(ellipse at 50% 0%,#1a001a,#0d000d 70%); }
    .r-reel      { --bgcol:#0d0002; --bcol:#2e0f0f; --gcol:#ff4444; --grd1:#1a0404; --grd2:#1e0404; --grd3:#280808; --pcol:#cc2222; --prun:#ff6666; --bggrad:radial-gradient(ellipse at 50% 0%,#1a0404,#0d0002 70%); }
    .r-mailer    { --bgcol:#000d0d; --bcol:#0f2e2e; --gcol:#00ffcc; --grd1:#001a1a; --grd2:#001e1e; --grd3:#002828; --pcol:#00aaaa; --prun:#44ffdd; --bggrad:radial-gradient(ellipse at 50% 0%,#001a1a,#000d0d 70%); }
    .r-analyst   { --bgcol:#020d00; --bcol:#1a2e0f; --gcol:#aaff00; --grd1:#0a1a00; --grd2:#0a1e00; --grd3:#0e2800; --pcol:#88aa00; --prun:#ccff44; --bggrad:radial-gradient(ellipse at 50% 0%,#0a1a00,#020d00 70%); }

    /* ── ROOM HEADER ── */
    .room-hdr {
      position: relative; z-index: 2; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 8px 4px;
      background: rgba(0,0,0,.65);
      border-bottom: 1px solid var(--bcol);
    }
    .room-name  { font-size: 9px; letter-spacing: 3px; color: var(--gcol); text-shadow: 0 0 6px var(--gcol); }
    .room-label { font-size: 7px; color: #3d6050; letter-spacing: 1px; margin-top: 1px; }
    .status-pill {
      font-size: 8px; letter-spacing: 1px; padding: 1px 6px;
      border: 1px solid var(--pcol); color: var(--pcol);
    }
    .room.running  .status-pill { color: var(--prun); border-color: var(--prun); box-shadow: 0 0 7px var(--prun); animation: pill-pulse 1s ease-in-out infinite; }
    .room.complete .status-pill { color: #00aa44; border-color: #00aa44; }
    .room.error    .status-pill { color: #ff4444; border-color: #ff4444; }
    @keyframes pill-pulse { 0%,100%{opacity:1}50%{opacity:.4} }

    /* ── SCENE ── */
    .room-scene { flex: 1; position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }

    .scene-deco {
      position: absolute; top: 5px; left: 0; right: 0;
      font-size: 13px; text-align: center; letter-spacing: 3px;
      opacity: .18; user-select: none; pointer-events: none;
      transition: opacity .4s;
    }
    .room.running .scene-deco { opacity: .55; }
    .room.complete .scene-deco { opacity: .28; }

    /* character */
    .char {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -58%);
      font-size: 30px; line-height: 1; z-index: 3; user-select: none;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 6px var(--gcol));
      transition: filter .3s;
    }
    .room.running .char {
      animation: float 1.4s ease-in-out infinite, char-glow 1s ease-in-out infinite;
      font-size: 34px;
    }
    .room.complete .char { filter: drop-shadow(0 0 10px var(--gcol)); }
    @keyframes float    { 0%,100%{transform:translate(-50%,-58%)} 50%{transform:translate(-50%,-68%)} }
    @keyframes char-glow{ 0%,100%{filter:drop-shadow(0 0 12px var(--gcol))} 50%{filter:drop-shadow(0 0 22px var(--gcol)) drop-shadow(0 0 8px white)} }

    /* scan line */
    .scan {
      display: none; position: absolute;
      left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gcol), transparent);
      z-index: 5; opacity: .7;
      animation: scan-sweep 1.8s linear infinite;
    }
    .room.running .scan { display: block; }
    @keyframes scan-sweep { 0%{top:-2px} 100%{top:100%} }

    /* pixel ground */
    .ground {
      height: 16px; flex-shrink: 0; position: relative; z-index: 2;
      background: repeating-linear-gradient(90deg, var(--grd2) 0px, var(--grd2) 7px, var(--grd3) 7px, var(--grd3) 8px);
      border-top: 2px solid var(--bcol);
    }
    .ground::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gcol), transparent);
      opacity: .15; transition: opacity .3s;
    }
    .room.running .ground::before { opacity: .8; animation: ground-pulse 1.2s ease-in-out infinite; }
    .room.complete .ground::before { opacity: .35; }
    @keyframes ground-pulse { 0%,100%{opacity:.5}50%{opacity:1} }

    /* particles */
    .particles { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
    .particle {
      position: absolute; width: 3px; height: 3px; opacity: 0;
      background: var(--gcol); image-rendering: pixelated;
      animation: ptcl var(--dur) ease-in var(--delay) infinite;
    }
    @keyframes ptcl {
      0%   { opacity: 0; transform: translateY(0) scale(1.2); }
      15%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-55px) scale(0); }
    }

    /* ── ROOM FOOTER ── */
    .room-ftr {
      position: relative; z-index: 2; flex-shrink: 0;
      padding: 4px 8px 5px;
      background: rgba(0,0,0,.72);
      border-top: 1px solid var(--bcol);
    }
    .action-txt {
      font-size: 9px; color: #3d6050;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 4px; min-height: 11px; transition: color .3s;
    }
    .room.running  .action-txt { color: var(--gcol); }
    .room.complete .action-txt { color: #00aa44; }
    .room.error    .action-txt { color: #ff4444; }

    .xp-row { display: flex; align-items: center; gap: 5px; }
    .xp-bar { flex: 1; height: 4px; background: #050f08; border: 1px solid #0f2018; overflow: hidden; }
    .xp-fill { height: 100%; background: var(--pcol); transition: width .9s ease; }
    .room.running  .xp-fill { background: var(--prun); box-shadow: 2px 0 8px var(--prun); animation: xp-anim 1s ease-in-out infinite; }
    .room.complete .xp-fill { background: #00aa44; }
    .room.error    .xp-fill { background: #ff4444; }
    @keyframes xp-anim { 0%,100%{opacity:1}50%{opacity:.55} }
    .xp-pct { font-size: 8px; color: #3d6050; width: 26px; text-align: right; }

    /* ── HUD ── */
    .hud {
      flex-shrink: 0; height: 52px;
      background: rgba(0,0,0,.93);
      border-top: 2px solid #0f2e18;
      display: grid;
      grid-template-columns: repeat(5,1fr) 1.6fr;
    }
    .hud-stat {
      padding: 5px 12px;
      border-right: 1px solid #0f2e18;
      display: flex; flex-direction: column; justify-content: center; gap: 2px;
    }
    .hud-val { font-size: 20px; font-weight: bold; color: #00ff6a; text-shadow: 0 0 8px #00ff6a55; line-height: 1; }
    .hud-lbl { font-size: 8px; color: #3d6050; letter-spacing: 2px; text-transform: uppercase; }
    .hud-log {
      grid-column: 6; padding: 5px 12px;
      display: flex; flex-direction: column; justify-content: center; gap: 2px; overflow: hidden;
    }
    .log-entry { font-size: 9px; color: #2d5a3a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .log-entry.ok    { color: #00cc44; }
    .log-entry.err   { color: #ff4444; }
    .log-entry.start { color: #ffaa00; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: #0f2e18; }
  </style>
</head>
<body>
<canvas id="stars"></canvas>

<div id="app">
  <header>
    <div class="hdr-logo">⬡ TCC RPG WORLD — AGENT MAP</div>
    <div class="hdr-meta">
      <div class="hdr-tag lit" id="h-sys">ONLINE</div>
      <div class="hdr-tag" id="h-agent">9 AGENTS · STANDBY</div>
      <div class="hdr-tag">SCHED · MON WED FRI · 06:00</div>
    </div>
    <div class="hdr-clock" id="clock">00:00:00</div>
  </header>

  <div class="world" id="world"></div>

  <div class="hud">
    <div class="hud-stat">
      <div class="hud-val" id="h-posts">—</div>
      <div class="hud-lbl">Posts</div>
    </div>
    <div class="hud-stat">
      <div class="hud-val" id="h-social">—</div>
      <div class="hud-lbl">Social</div>
    </div>
    <div class="hud-stat">
      <div class="hud-val" id="h-reels">—</div>
      <div class="hud-lbl">Reels</div>
    </div>
    <div class="hud-stat">
      <div class="hud-val" id="h-emails">—</div>
      <div class="hud-lbl">Emails</div>
    </div>
    <div class="hud-stat" style="border-right:none">
      <div class="hud-val" style="font-size:10px;color:#3d7a52;letter-spacing:0" id="h-lastrun">—</div>
      <div class="hud-lbl" id="h-slug" style="color:#2a5a3a">—</div>
    </div>
    <div class="hud-log" id="hud-log"></div>
  </div>
</div>

<script>
const AGENTS = [
  { id:"Scout",     cls:"r-scout",     emoji:"🔍", label:"WILDERNESS",    deco:"🌲🌿🌲" },
  { id:"Amazon",    cls:"r-amazon",    emoji:"📦", label:"TRADING POST",  deco:"💰🪙⚖️" },
  { id:"Scribe",    cls:"r-scribe",    emoji:"✍️",  label:"ARCANE LIBRARY",deco:"📚🕯️📜" },
  { id:"Image",     cls:"r-image",     emoji:"🖼️",  label:"ARTIST FORGE",  deco:"🔥⚒️🔥" },
  { id:"Publisher", cls:"r-publisher", emoji:"📤", label:"LAUNCH PAD",    deco:"🚀🌌⭐" },
  { id:"Spark",     cls:"r-spark",     emoji:"⚡", label:"NEON STAGE",    deco:"🎤🎶💜" },
  { id:"Reel",      cls:"r-reel",      emoji:"🎬", label:"FILM STUDIO",   deco:"🎥🎞️🎬" },
  { id:"Mailer",    cls:"r-mailer",    emoji:"📧", label:"POST OFFICE",   deco:"✉️📮🗃️" },
  { id:"Analyst",   cls:"r-analyst",   emoji:"📊", label:"WAR ROOM",      deco:"🗺️📡🔭" },
];

const ROLES = {
  Scout:"Research & pick topic", Amazon:"Find affiliate product",
  Scribe:"Write full post", Image:"Generate cover image",
  Publisher:"Publish to posts.js + git", Spark:"Write social captions",
  Reel:"Short-form video script", Mailer:"Draft newsletter", Analyst:"Performance analysis",
};

const XP_BASE = { Scout:88,Amazon:75,Scribe:92,Image:81,Publisher:95,Spark:70,Reel:65,Mailer:60,Analyst:40 };

// ── Build rooms ───────────────────────────────────────────────────────────────
function buildRooms() {
  const world = document.getElementById("world");
  AGENTS.forEach(ag => {
    const el = document.createElement("div");
    el.className = `room ${ag.cls} idle`;
    el.id = `room-${ag.id}`;
    el.innerHTML = `
      <div class="room-hdr">
        <div>
          <div class="room-name">${ag.id.toUpperCase()}</div>
          <div class="room-label">${ag.label}</div>
        </div>
        <div class="status-pill" id="pill-${ag.id}">IDLE</div>
      </div>
      <div class="room-scene">
        <div class="scan"></div>
        <div class="scene-deco">${ag.deco}</div>
        <div class="char">${ag.emoji}</div>
        <div class="particles" id="ptcl-${ag.id}"></div>
        <div class="ground"></div>
      </div>
      <div class="room-ftr">
        <div class="action-txt" id="act-${ag.id}">${ROLES[ag.id]}</div>
        <div class="xp-row">
          <div class="xp-bar"><div class="xp-fill" id="xp-${ag.id}" style="width:0%"></div></div>
          <div class="xp-pct" id="xpp-${ag.id}">0%</div>
        </div>
      </div>`;
    world.appendChild(el);
  });
}

// ── Particle system ───────────────────────────────────────────────────────────
const activeParticles = new Set();

function startParticles(id) {
  if (activeParticles.has(id)) return;
  activeParticles.add(id);
  const c = document.getElementById(`ptcl-${id}`);
  if (!c) return;
  c.innerHTML = "";
  for (let i = 0; i < 14; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left   = (Math.random() * 88 + 6) + "%";
    p.style.bottom = (Math.random() * 18 + 2) + "px";
    p.style.setProperty("--dur",   (1.2 + Math.random() * 1.6) + "s");
    p.style.setProperty("--delay", (Math.random() * 2.5) + "s");
    c.appendChild(p);
  }
}

function stopParticles(id) {
  if (!activeParticles.has(id)) return;
  activeParticles.delete(id);
  const c = document.getElementById(`ptcl-${id}`);
  if (c) c.innerHTML = "";
}

// ── Update rooms ──────────────────────────────────────────────────────────────
function xpPct(name, status) {
  if (status === "complete") return 100;
  if (status === "running")  return 62;
  if (status === "error")    return XP_BASE[name] ?? 30;
  return 0;
}

function updateRooms(agents) {
  const labels = { idle:"IDLE", running:"ACTIVE", complete:"DONE", error:"ERROR", skipped:"SKIP" };
  AGENTS.forEach(ag => {
    const a  = agents?.[ag.id] ?? { status:"idle", lastMessage:"" };
    const st = a.status || "idle";
    const pct = xpPct(ag.id, st);
    document.getElementById(`room-${ag.id}`).className = `room ${ag.cls} ${st}`;
    document.getElementById(`pill-${ag.id}`).textContent = labels[st] || st.toUpperCase();
    document.getElementById(`act-${ag.id}`).textContent  = a.lastMessage || ROLES[ag.id];
    document.getElementById(`xp-${ag.id}`).style.width   = pct + "%";
    document.getElementById(`xpp-${ag.id}`).textContent  = pct + "%";
    if (st === "running") startParticles(ag.id);
    else stopParticles(ag.id);
  });
}

// ── HUD log ───────────────────────────────────────────────────────────────────
function renderLog(feed) {
  const el = document.getElementById("hud-log");
  el.innerHTML = (feed || []).slice(0, 3).map(e => {
    const cls = e.message.includes("✓") ? "ok" : e.message.includes("✗") ? "err"
              : e.message.toLowerCase().includes("started") ? "start" : "";
    const t = e.time ? new Date(e.time).toLocaleTimeString("en-US",{hour12:false}) : "";
    const icon = cls==="ok"?"✓":cls==="err"?"✗":cls==="start"?"▶":"·";
    return `<div class="log-entry ${cls}">${t} ${icon} ${e.message}</div>`;
  }).join("");
}

// ── Clock ─────────────────────────────────────────────────────────────────────
setInterval(() => {
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("en-US",{hour12:false});
}, 1000);
document.getElementById("clock").textContent =
  new Date().toLocaleTimeString("en-US",{hour12:false});

// ── Star field ────────────────────────────────────────────────────────────────
function initStars() {
  const cv  = document.getElementById("stars");
  const ctx = cv.getContext("2d");
  let W, H, stars;

  function resize() {
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
    stars = Array.from({length:220}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.4+.2,
      o: Math.random(),
      d: (Math.random()*.025+.004) * (Math.random()>.5?1:-1),
      c: Math.random()>.9 ? [100,200,255] : [160,255,190],
    }));
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle="#00000f"; ctx.fillRect(0,0,W,H);
    stars.forEach(s => {
      s.o = Math.max(0, Math.min(1, s.o + s.d));
      if (s.o<=0||s.o>=1) s.d*=-1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${s.c[0]},${s.c[1]},${s.c[2]},${s.o*.75})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  resize();
  window.addEventListener("resize", resize);
  draw();
}

// ── Main refresh ──────────────────────────────────────────────────────────────
async function refresh() {
  try {
    const [sRes, pRes] = await Promise.all([fetch("/api/status"), fetch("/api/posts")]);
    const s = await sRes.json();
    const p = await pRes.json();

    const running = s.isRunning;
    document.getElementById("h-sys").textContent = running ? "● RUNNING" : "ONLINE";
    document.getElementById("h-sys").className   = running ? "hdr-tag lit" : "hdr-tag lit";
    document.getElementById("h-agent").textContent =
      running && s.currentAgent
        ? `▶ ${s.currentAgent.toUpperCase()} ACTIVE`
        : "9 AGENTS · STANDBY";
    document.getElementById("h-agent").className =
      running ? "hdr-tag lit" : "hdr-tag";

    document.getElementById("h-posts").textContent  = p.count ?? "—";
    document.getElementById("h-social").textContent = s.stats?.totalSocialCaptions ?? "—";
    document.getElementById("h-reels").textContent  = p.outputs?.reels ?? "—";
    document.getElementById("h-emails").textContent = p.outputs?.emails ?? "—";

    const lastRun = s.lastRunDate
      ? new Date(s.lastRunDate).toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false})
      : "Never";
    document.getElementById("h-lastrun").textContent = `Last run: ${lastRun}`;
    document.getElementById("h-slug").textContent    = s.stats?.lastPostSlug ? `/${s.stats.lastPostSlug}` : "—";

    updateRooms(s.agents);
    renderLog(s.activityFeed);
  } catch(e) {
    console.warn("fetch:", e.message);
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
buildRooms();
initStars();
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
